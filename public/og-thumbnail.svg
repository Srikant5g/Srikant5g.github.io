  <!-- Row 1: Srikanth G, Sajjad Hussain, Raghavendra G -->
  <g transform="translate(110, 332)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="30" rx="8" fill="rgba(20, 184, 166, 0.25)" stroke="#14b8a6" stroke-width="1" />
    <circle cx="15" cy="15" r="9" fill="#14b8a6" />
    <text x="15" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">S</text>
    <text x="32" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Srikanth G</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="155" height="30" rx="8" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1" />
    <circle cx="160" cy="15" r="9" fill="#10b981" />
    <text x="160" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">S</text>
    <text x="177" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Sajjad Hussain</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="165" height="30" rx="8" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1" />
    <circle cx="325" cy="15" r="9" fill="#6366f1" />
    <text x="325" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">R</text>
    <text x="342" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Raghavendra G</text>
  </g>

  <!-- Row 2: Mohan Reddy P, Md Rabbani, Harsha N, Arun U -->
  <g transform="translate(110, 372)">
    <!-- Pill 4 -->
    <rect x="0" y="0" width="155" height="30" rx="8" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="1" />
    <circle cx="15" cy="15" r="9" fill="#a855f7" />
    <text x="15" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">M</text>
    <text x="32" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Mohan Reddy P</text>

    <!-- Pill 5 -->
    <rect x="165" y="0" width="135" height="30" rx="8" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1" />
    <circle cx="180" cy="15" r="9" fill="#f59e0b" />
    <text x="180" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">M</text>
    <text x="197" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Md Rabbani</text>

    <!-- Pill 6 -->
    <rect x="310" y="0" width="115" height="30" rx="8" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="1" />
    <circle cx="325" cy="15" r="9" fill="#f43f5e" />
    <text x="325" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">H</text>
    <text x="342" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Harsha N</text>
  </g>

  <!-- Row 3: Arun U -->
  <g transform="translate(110, 412)">
    <rect x="0" y="0" width="110" height="30" rx="8" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1" />
    <circle cx="15" cy="15" r="9" fill="#06b6d4" />
    <text x="15" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">A</text>
    <text x="32" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Arun U</text>
  </g>

  <!-- Bottom Features Bar inside Card -->
  <g transform="translate(110, 465)">
    <rect width="480" height="52" rx="14" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.15)" />
    <!-- Bullet 1 -->
    <text x="20" y="31" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">⚡ Live Cross-Tab Sync</text>
    <text x="175" y="31" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">•</text>
    <!-- Bullet 2 -->
    <text x="195" y="31" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">💳 1-Tap UPI</text>
    <text x="290" y="31" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">•</text>
    <!-- Bullet 3 -->
    <text x="310" y="31" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🔒 PIN 0852 Protected</text>
  </g>

  <!-- Floating URL badge in top right -->
  <g transform="translate(930, 45)">
    <rect width="200" height="34" rx="17" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" />
    <text x="100" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">srikant5g.github.io</text>
  </g>
</svg>
