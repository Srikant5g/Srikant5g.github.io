<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c3a2f" />
      <stop offset="50%" stop-color="#145B4A" />
      <stop offset="100%" stop-color="#092820" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78C5A7" />
      <stop offset="100%" stop-color="#9ce0c7" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Card (Frosted Glass Panel) -->
  <rect x="80" y="80" width="580" height="470" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Top Category Pill -->
  <g transform="translate(120, 125)">
    <rect width="250" height="32" rx="16" fill="rgba(120, 197, 167, 0.18)" stroke="#78C5A7" stroke-width="1" />
    <text x="16" y="21" fill="#78C5A7" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GROUP TRAVEL EXPENSE</text>
  </g>

  <!-- Brand Name -->
  <g transform="translate(120, 225)">
    <!-- TripTally Logo Icon -->
    <rect width="52" height="52" rx="14" fill="#78C5A7" />
    <rect x="12" y="15" width="4.5" height="22" rx="2.2" fill="#145B4A" />
    <rect x="22" y="15" width="4.5" height="22" rx="2.2" fill="#145B4A" />
    <rect x="32" y="15" width="4.5" height="22" rx="2.2" fill="#145B4A" />
    <path d="M10 33L39 18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="43" cy="14" r="4" fill="#FF784F" />

    <text x="68" y="38" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Trip<tspan fill="#78C5A7">Tally</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="120" y="275" fill="#e2e8f0" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600">
    Every trip. Every expense. Sorted.
  </text>

  <!-- Divider -->
  <line x1="120" y1="310" x2="620" y2="310" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Feature Points -->
  <g transform="translate(120, 335)" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="500">
    <!-- Point 1 -->
    <circle cx="10" cy="12" r="6" fill="#78C5A7" />
    <text x="28" y="17" fill="#ffffff">Smart equal &amp; custom expense splitting</text>

    <!-- Point 2 -->
    <circle cx="10" cy="46" r="6" fill="#78C5A7" />
    <text x="28" y="51" fill="#ffffff">Minimal-transaction simplified debt algorithm</text>

    <!-- Point 3 -->
    <circle cx="10" cy="80" r="6" fill="#78C5A7" />
    <text x="28" y="85" fill="#ffffff">1-Click direct UPI settlement (GPay, PhonePe)</text>

    <!-- Point 4 -->
    <circle cx="10" cy="114" r="6" fill="#FF784F" />
    <text x="28" y="119" fill="#ffffff">Interactive financial insights &amp; category breakdown</text>
  </g>

  <!-- Right Visual: Mobile Card Mockup Showcase -->
  <g transform="translate(710, 95)" filter="url(#shadow)">
    <!-- Main Card Mockup -->
    <rect width="410" height="440" rx="22" fill="#FFFFFF" />

    <!-- Card Top Header -->
    <rect width="410" height="70" rx="22" fill="#F7F8F5" />
    <rect x="24" y="20" width="36" height="36" rx="10" fill="#145B4A" />
    <text x="34" y="43" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800">TT</text>
    <text x="70" y="36" fill="#192B3D" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="700">Road Trip 2026</text>
    <text x="70" y="51" fill="#718096" font-family="'Inter', -apple-system, sans-serif" font-size="11">7 participants • 8 expenses</text>

    <!-- Hero Balance Banner inside Mockup -->
    <rect x="24" y="88" width="362" height="96" rx="16" fill="#145B4A" />
    <text x="44" y="116" fill="#78C5A7" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">NET BALANCE</text>
    <text x="44" y="152" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="900">+₹6,214.29</text>
    <text x="240" y="150" fill="#78C5A7" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700">You are owed</text>

    <!-- Sample Expense Row 1 -->
    <g transform="translate(24, 202)">
      <rect width="362" height="60" rx="12" fill="#F7F8F5" stroke="#E4EAF0" stroke-width="1" />
      <text x="16" y="36" font-size="18">⛽</text>
      <text x="48" y="28" fill="#192B3D" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700">Car Diesel Full Tank</text>
      <text x="48" y="44" fill="#718096" font-family="'Inter', -apple-system, sans-serif" font-size="11">You paid ₹5,800 • Split 7</text>
      <text x="280" y="35" fill="#145B4A" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800">+₹4,971.43</text>
    </g>

    <!-- Sample Expense Row 2 -->
    <g transform="translate(24, 272)">
      <rect width="362" height="60" rx="12" fill="#F7F8F5" stroke="#E4EAF0" stroke-width="1" />
      <text x="16" y="36" font-size="18">🏡</text>
      <text x="48" y="28" fill="#192B3D" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700">Private Villa Stay</text>
      <text x="48" y="44" fill="#718096" font-family="'Inter', -apple-system, sans-serif" font-size="11">Rabbani paid ₹24,500</text>
      <text x="280" y="35" fill="#FF784F" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800">-₹3,500.00</text>
    </g>

    <!-- Quick Settle Pill Action -->
    <g transform="translate(24, 348)">
      <rect width="362" height="48" rx="12" fill="#145B4A" />
      <text x="181" y="30" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Settle Up via UPI ⚡</text>
    </g>
  </g>
</svg>
